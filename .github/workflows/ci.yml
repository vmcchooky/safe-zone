name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  # Superseded pull-request runs are cancelled so rapid pushes to one PR do
  # not queue a fleet of obsolete runners. Pushes (including to main) always
  # run to completion: a cancelled main run would leave required checks
  # pending until a re-run is requested.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # actionlint validates workflow syntax, expression types, and the shell
      # inside run blocks (the image bundles shellcheck and pyflakes). Pinned
      # by digest like every third-party dependency here.
      - name: Lint GitHub Actions workflows
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  build-metadata:
    name: Build metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - name: Generate timestamp
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The production deploy is the merge of both files. Assert the shape the
      # docs promise instead of trusting a profile flag in a shell script:
      # feed-syncd must be in the stack, and the shared .env must not leak
      # SAFE_ZONE_ENV=local into the production services.
      - name: Check the canonical production stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --format json > production-compose.json
          jq -e '.services["feed-syncd"] != null' production-compose.json
          jq -e '.services["core-api"].environment.SAFE_ZONE_ENV == "production"' production-compose.json
          jq -e '.services["dns-resolver"].environment.SAFE_ZONE_ENV == "production"' production-compose.json
          jq -e '.services["dns-resolver"].environment.SAFE_ZONE_DNS_DOT_ENABLED == "false"' production-compose.json
          jq -e '[.services["dns-resolver"].ports[]? | select((.target|tostring) == "8533")] | length == 0' production-compose.json

          # A shared .env from the developer stack may enable DoT. The production
          # base must still keep 853 closed; only the overlay may open it.
          cp .env .env.compose-check
          printf '\nSAFE_ZONE_DNS_DOT_ENABLED=true\n' >> .env
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --format json > production-compose-env-dot.json
          jq -e '.services["dns-resolver"].environment.SAFE_ZONE_DNS_DOT_ENABLED == "false"' production-compose-env-dot.json
          jq -e '[.services["dns-resolver"].ports[]? | select((.target|tostring) == "8533")] | length == 0' production-compose-env-dot.json
          mv .env.compose-check .env

      # The Go services bind unprivileged ports, need no kernel capabilities,
      # and run as the non-root app user. Assert the hardening in the rendered
      # stack instead of trusting the compose source. Caddy and redis are
      # deliberately excluded until they are verified without their defaults.
      - name: Check container hardening
        run: |
          for service in core-api dns-resolver feed-syncd; do
            jq -e --arg s "$service" '.services[$s].cap_drop == ["ALL"]' production-compose.json
            jq -e --arg s "$service" '.services[$s].security_opt == ["no-new-privileges:true"]' production-compose.json
          done

          # feed-sync is a one-shot profile, so render it explicitly.
          docker compose -f docker-compose.yml -f docker-compose.production.yml \
            --profile feed-sync-once config --format json > feed-sync-compose.json
          jq -e '.services["feed-sync"].cap_drop == ["ALL"]' feed-sync-compose.json
          jq -e '.services["feed-sync"].security_opt == ["no-new-privileges:true"]' feed-sync-compose.json

          # Caddy is profile-gated in the base stack; render it here so the
          # exclusion is checked on a config that actually contains it.
          docker compose -f docker-compose.yml -f docker-compose.production.yml \
            --profile production-edge config --format json > production-compose-edge.json
          for service in caddy redis; do
            jq -e --arg s "$service" '.services[$s].cap_drop == null' production-compose-edge.json
            jq -e --arg s "$service" '.services[$s].security_opt == null' production-compose-edge.json
          done

      # DoT is opt-in. The overlay must add both the trusted certificate paths
      # and the 853 publish without changing the default production stack.
      - name: Check the opt-in DoT overlay
        run: |
          docker compose -f docker-compose.yml -f docker-compose.production.yml -f ops/vps-edge/docker-compose.dot.yml config --format json > production-compose-dot.json
          jq -e '.services["dns-resolver"].environment.SAFE_ZONE_DNS_DOT_ENABLED == "true"' production-compose-dot.json
          jq -e '.services["dns-resolver"].environment.SAFE_ZONE_DNS_DOT_CERT_FILE == "/run/safe-zone/dot-certs/fullchain.pem"' production-compose-dot.json
          jq -e '.services["dns-resolver"].environment.SAFE_ZONE_DNS_DOT_KEY_FILE == "/run/safe-zone/dot-certs/privkey.pem"' production-compose-dot.json
          jq -e '[.services["dns-resolver"].ports[]? | select((.target|tostring) == "8533" and (.published|tostring) == "853")] | length == 1' production-compose-dot.json

      # Shared-host-edge still uses the production base (feed-syncd and
      # production guards) but must never start the bundled Caddy, even when
      # the deploy helper passes --profile production-edge.
      - name: Check the shared-host-edge stack
        run: |
          cp .env .env.ci-backup
          trap 'mv .env.ci-backup .env' EXIT
          cp ops/vps-edge/env.shared-host-edge.production.example .env
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            -f ops/vps-edge/docker-compose.host-edge.yml \
            --profile production-edge \
            config --format json > shared-host-compose.json
          jq -e '.services["caddy"] == null' shared-host-compose.json
          jq -e '.services["feed-syncd"] != null' shared-host-compose.json
          jq -e '.services["core-api"].environment.SAFE_ZONE_ENV == "production"' shared-host-compose.json
          jq -e '.services["dns-resolver"].environment.SAFE_ZONE_DNS_DOT_ENABLED == "false"' shared-host-compose.json
          jq -e '[.services["dns-resolver"].ports[]? | select((.target|tostring) == "8533")] | length == 0' shared-host-compose.json
          jq -e '[.services["core-api"].ports[]? | select(.host_ip == "127.0.0.1" and ((.target|tostring) == "8080"))] | length == 1' shared-host-compose.json
          jq -e '[.services["dns-resolver"].ports[]? | select(.host_ip == "127.0.0.1" and ((.target|tostring) == "8081"))] | length == 1' shared-host-compose.json

          # Direct DoT stays opt-in in shared-host mode too: the overlay opens
          # 853 but still must not activate the bundled Caddy.
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            -f ops/vps-edge/docker-compose.host-edge.yml \
            -f ops/vps-edge/docker-compose.dot.yml \
            --profile production-edge \
            config --format json > shared-host-compose-dot.json
          jq -e '.services["caddy"] == null' shared-host-compose-dot.json
          jq -e '.services["dns-resolver"].environment.SAFE_ZONE_DNS_DOT_ENABLED == "true"' shared-host-compose-dot.json
          jq -e '[.services["dns-resolver"].ports[]? | select((.target|tostring) == "8533" and (.published|tostring) == "853")] | length == 1' shared-host-compose-dot.json

      # The developer stack stays opt-in; that is the contract the production
      # override exists to preserve.
      - name: Check the developer stack stays opt-in
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --services > dev-compose-services.txt
          if grep -qx 'feed-syncd' dev-compose-services.txt; then
            echo "feed-syncd must not be enabled in the developer stack" >&2
            exit 1
          fi

  # Boot the developer stack for real. compose-config only renders YAML; the
  # published-port DoH regression and the admin-secret rotation regression that
  # shipped past it are both invisible without running containers, so this job
  # builds the images and exercises the stack end to end. Diagnostics are
  # uploaded on failure; the stack is torn down in every outcome.
  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run compose smoke
        run: bash scripts/ops/compose-smoke.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-smoke-diagnostics
          path: tmp/compose-smoke/
          if-no-files-found: ignore

      # The script tears the stack down in its own EXIT trap; this step only
      # matters if the runner died before that trap was installed.
      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans

  # The deploy helper and the two optional monitoring scripts have no Go
  # package to hang tests off. Run their shell suites here, and run the
  # PowerShell parity suite on Windows because its compose stub is a .cmd.
  ops-scripts:
    name: Ops script tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run shell ops tests
        run: |
          bash scripts/ops/tests/safe-zone-preflight-test.sh
          bash scripts/ops/tests/monitor-certs-test.sh
          bash scripts/ops/tests/public-edge-smoke-test.sh

      # Lint every ops script, not a hand-maintained subset: the four scripts
      # listed here used to grow one at a time, so bench.sh, coverage.sh and
      # the other helpers were never checked. The glob also covers new files
      # without another workflow edit.
      - name: ShellCheck ops scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/ops/*.sh scripts/ops/tests/*.sh

  ops-scripts-windows:
    name: Ops script tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run PowerShell preflight tests
        shell: pwsh
        run: ./scripts/ops/tests/safe-zone-preflight-test.ps1

  # Each gate group gets its own runner. Measured on a single quality runner,
  # all of these ran against the same vCPUs: the task graph was 656s wall-clock
  # for 2671s of task time, i.e. saturated at ~4x parallelism. Splitting does not
  # drop any gate; it stops the groups from competing for the same cores.
  #
  # The Go group still needs Node: internal/api/app embeds the UI bundle, so
  # go:build and go:test depend on ui:bundle and cannot compile without it.
  go-gates:
    name: Go gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Restore before mise installs the Go-based scanners. `mise install`
      # runs `go install` for gosec and govulncheck, which writes read-only
      # files into GOMODCACHE. When the restore ran after that, tar aborted
      # with "File exists" (12,801 entries across 31 scanner-only modules),
      # actions/cache reported the whole restore as a miss, and every Go job
      # kept compiling from scratch. Restoring first also lets the scanner
      # install reuse the cached modules instead of re-downloading them.
      - name: Restore Go build and module cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-v2-${{ runner.os }}-

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
        with:
          cache: true
          cache_key: ml-pyproject-${{ hashFiles('ml/pyproject.toml') }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore golangci-lint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('.golangci.yml') }}

      - name: Install UI dependencies
        run: npm ci --prefix ui

      # Lint, build, the -race suite, the 65% coverage gate, gosec and
      # govulncheck, the frozen decision evaluation, and the research CLI tests.
      - name: Run Go gates
        run: mise run ci:go

      # Only the Go gates job saves the cache, and only on main. The UI e2e
      # shards restore the same key read-only: when all four jobs saved it,
      # the first one to finish won the reservation, so the archive often held
      # a shard's core-api-only build instead of the full build + race-test
      # cache this job produces. Pull requests restore main's archive through
      # restore-keys; letting every PR save would add ~572 MiB per pull request
      # to the repository's 10 GiB cache budget. `cache-hit` is false on a
      # restore-keys match, so a new go.mod still refreshes the exact key on
      # the next main run.
      #
      # The save is best-effort: two concurrent main pushes compute the same
      # key, and the run that loses the reservation must not turn an otherwise
      # green gate run red.
      - name: Save Go build and module cache
        if: success() && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}

  # Every fuzz target gets a 20-second budget on each PR. The seed corpus and
  # any crash found before also run as plain unit tests inside go:test, so a
  # failure here means a genuinely new finding; long-horizon runs belong to a
  # nightly workflow, not to every push. -parallel=1 keeps each run cheap and
  # deterministic. The dns and risk packages do not import the embedded UI
  # bundle, so this job needs no npm and no mise tasks beyond the toolchain.
  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore Go build and module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-v2-${{ runner.os }}-

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
        with:
          cache: true
          cache_key: ml-pyproject-${{ hashFiles('ml/pyproject.toml') }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzz smoke
        run: |
          go test -run='^$' -fuzz='^FuzzDoHServer$' -fuzztime=20s -parallel=1 ./internal/dns/doh/
          go test -run='^$' -fuzz='^FuzzResponseCache$' -fuzztime=20s -parallel=1 ./internal/dns/resolver/
          go test -run='^$' -fuzz='^FuzzUpstreamResponse$' -fuzztime=20s -parallel=1 ./internal/dns/resolver/
          go test -run='^$' -fuzz='^FuzzPolicyMatch$' -fuzztime=20s -parallel=1 ./internal/risk/

  # Restore is the least-tested critical path: this boots an isolated stack,
  # seeds state through the admin API, backs it up with the ops entrypoint,
  # destroys the state, restores, and verifies data came back (see
  # docs/runbooks/restore-drill.md). It found a real defect on its first run:
  # the Redis AOF replayed over the restored RDB snapshot and undid the
  # restore for cached state.
  restore-drill:
    name: Restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run restore drill
        run: bash scripts/ops/tests/restore-drill-test.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restore-drill-diagnostics
          path: tmp/restore-drill/
          if-no-files-found: ignore

      # The drill tears its own stack down in an EXIT trap; this step only
      # matters if the runner died before that trap was installed.
      - name: Tear down drill stack
        if: always()
        run: docker compose -p restore-drill -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans

  ui-e2e:
    name: UI e2e (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright runs with workers: 1 on CI, so the suite is serial and its
    # runtime is linear in the number of tests. Sharding hands each subset its
    # own runner and its own webServer pair, which is safe because a shard is
    # still serial and still isolated. fail-fast is off so one red shard does
    # not hide the state of the others.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The webServer starts core-api with `go run`, so the shard needs the Go
      # build cache even though it runs no Go gate. Restore before mise for the
      # same GOMODCACHE reason as the go-gates job, and leave saving to that
      # job so the shared archive always contains the full build cache.
      - name: Restore Go build and module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-v2-${{ runner.os }}-

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
        with:
          cache: true
          cache_key: ml-pyproject-${{ hashFiles('ml/pyproject.toml') }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # npm's download cache and the Playwright browser payload, both keyed so a
      # lockfile or Playwright version change invalidates them. `npm ci` still
      # verifies integrity against ui/package-lock.json, so a warm cache
      # changes the speed and not the installed tree.
      - name: Restore npm and Playwright browser caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ui-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/package.json') }}

      # Install the browser only. GitHub's ubuntu image already carries the
      # Chromium runtime libraries (verified in the apt output on 2026-10-27:
      # every required lib was "already the newest version"); the packages
      # --with-deps still fetched were fonts, xvfb and libnss3-tools, none of
      # which a headless run needs. That apt pass took 690-700s per shard
      # because the Ubuntu mirror was slow, while the shard itself runs in
      # 85-128s. A runner image that ever drops a real library fails at browser
      # launch with the missing soname, so this cannot silently skip a
      # requirement.
      - name: Install UI dependencies and Playwright Chromium
        run: |
          npm ci --prefix ui
          npm --prefix ui exec -- playwright install chromium

      - name: Run UI e2e shard
        env:
          SAFE_ZONE_E2E_SHARD: ${{ matrix.shard }}/3
        run: mise run ui:e2e:shard

  ml-gates:
    name: ML gates
    runs-on: ubuntu-latest
    # mise run ml:install builds the ML virtualenv and installs pinned wheels
    # (scikit-learn, lightgbm, pyarrow), which is a large first-run download.
    # The mise cache absorbs it on subsequent runs.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
        with:
          cache: true
          cache_key: ml-pyproject-${{ hashFiles('ml/pyproject.toml') }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # The ML tests were previously unreachable from CI: the .gitignore rule
      # `*.py` hid ml/tests/test_*.py, so pytest collected a suite missing four
      # of its modules.
      - name: Run ML gates
        run: mise run ci:ml

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - go-gates
      - ui-e2e
      - ml-gates
      - compose-config
      - build-metadata
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-api
          - dns-resolver
          - feed-sync
          - feed-syncd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: >
          docker build
          --build-arg SERVICE=${{ matrix.service }}
          --build-arg VERSION=ci
          --build-arg GIT_COMMIT=${{ github.sha }}
          --build-arg BUILD_TIME=${{ needs.build-metadata.outputs.build_time }}
          --build-arg IMAGE_TAG=safe-zone-${{ matrix.service }}:${{ github.sha }}
          --build-arg SOURCE_REPO=${{ github.server_url }}/${{ github.repository }}
          -t safe-zone-${{ matrix.service }}:${{ github.sha }}
          .
