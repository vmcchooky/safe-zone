name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-metadata:
    name: Build metadata
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - name: Generate timestamp
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  quality:
    name: Repository quality checks
    runs-on: ubuntu-latest
    # mise run ci now also builds the ML virtualenv and installs pinned wheels
    # (scikit-learn, lightgbm, pyarrow), which is a large first-run download.
    # The cache below absorbs it on subsequent runs.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: ml-pyproject-${{ hashFiles('ml/pyproject.toml') }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install UI dependencies and Playwright Chromium
        run: |
          npm ci --prefix ui
          npm --prefix ui exec -- playwright install --with-deps chromium

      # Runs go lint/test/build, the decision evaluations, the UI end-to-end
      # suite, the Go security scans, and the ML pytest suite (ml:install +
      # ml:test). The ML tests were previously unreachable from CI: the
      # .gitignore rule `*.py` hid ml/tests/test_*.py, so pytest collected a
      # suite missing four of its modules.
      - name: Run CI task graph
        run: mise run ci

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - quality
      - build-metadata
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-api
          - dns-resolver
          - feed-sync
          - feed-syncd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: >
          docker build
          --build-arg SERVICE=${{ matrix.service }}
          --build-arg VERSION=ci
          --build-arg GIT_COMMIT=${{ github.sha }}
          --build-arg BUILD_TIME=${{ needs.build-metadata.outputs.build_time }}
          --build-arg IMAGE_TAG=safe-zone-${{ matrix.service }}:${{ github.sha }}
          --build-arg SOURCE_REPO=${{ github.server_url }}/${{ github.repository }}
          -t safe-zone-${{ matrix.service }}:${{ github.sha }}
          .
