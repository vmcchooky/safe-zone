services:
  caddy:
    ports:
      - "80:80"
      - "443:443"

  core-api:
    environment:
      # .env.example ships SAFE_ZONE_ENV=local for the developer stack, and
      # Compose passes env_file values through. Pin the environment here so the
      # production stack cannot silently run with production guards disabled.
      SAFE_ZONE_ENV: production
      # Bound detailed SQLite growth in production while retaining an explicit
      # operator override for lower sampling on sustained high-volume hosts.
      # Audit and URL-ML feedback use separate unsampled writers.
      SAFE_ZONE_TELEMETRY_WRITE_PERCENT: ${SAFE_ZONE_TELEMETRY_WRITE_PERCENT:-5}
    ports:
      - "127.0.0.1:8080:8080"

  dns-resolver:
    environment:
      # See the core-api note above: the base .env is shared with the developer
      # stack, so production must not inherit SAFE_ZONE_ENV=local from it.
      SAFE_ZONE_ENV: production
      # DoT is opt-in and needs both a trusted certificate pair and the
      # published port from ops/vps-edge/docker-compose.dot.yml. Pin it off
      # here so a developer .env that enables DoT cannot make the production
      # base start a listener without the certificate mount.
      SAFE_ZONE_DNS_DOT_ENABLED: "false"
    ports:
      - "127.0.0.1:8081:8081"
    # DoT is opt-in. Merge ops/vps-edge/docker-compose.dot.yml to publish 853
    # and mount a trusted pair; scripts/ops/safe-zone.sh adds that overlay
    # automatically when SAFE_ZONE_DNS_DOT_ENABLED=true. Keeping the port out
    # of the default stack means a disabled DoT cannot leave 853 published
    # with no listener; check-production-ports.sh reports that as a failure.

  feed-syncd:
    # The daemon is part of the production stack: a deployment with no feed
    # blocks nothing the lexical heuristics do not catch. The base file keeps
    # the profile so the developer stack stays opt-in; !reset removes it here.
    # Compose merges profiles additively, so `profiles: []` is not enough.
    profiles: !reset []
