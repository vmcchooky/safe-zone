services:
  caddy:
    ports:
      - "80:80"
      - "443:443"

  core-api:
    environment:
      # Bound detailed SQLite growth in production while retaining an explicit
      # operator override for lower sampling on sustained high-volume hosts.
      # Audit and URL-ML feedback use separate unsampled writers.
      SAFE_ZONE_TELEMETRY_WRITE_PERCENT: ${SAFE_ZONE_TELEMETRY_WRITE_PERCENT:-5}
    ports:
      - "127.0.0.1:8080:8080"

  dns-resolver:
    environment:
      SAFE_ZONE_DNS_DOT_CERT_FILE: /run/safe-zone/dot-certs/fullchain.pem
      SAFE_ZONE_DNS_DOT_KEY_FILE: /run/safe-zone/dot-certs/privkey.pem
    ports:
      - "127.0.0.1:8081:8081"
      - "${SAFE_ZONE_DNS_DOT_PUBLISHED_PORT:-853}:${SAFE_ZONE_DNS_DOT_CONTAINER_PORT:-8533}"
    volumes:
      - "${SAFE_ZONE_DNS_DOT_CERTS_DIR:-./ops/certs/dot}:/run/safe-zone/dot-certs:ro"
