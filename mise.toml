[tools]
# Single source of truth for the Go toolchain. go.mod (go + toolchain
# directives) and Dockerfile (golang: image) must state this same version.
go = "1.26.10"
node = "24"
python = "3.13.14"
golangci-lint = "2.12.2"
# Security scanners live here next to the linter instead of being fetched by
# `go run pkg@version` on every CI run. The go: backend builds them with the
# Go toolchain above, so versions resolve once, install into the mise shims,
# and stay on PATH for every task below. Pin with the full module version.
"go:github.com/securego/gosec/v2/cmd/gosec" = "v2.28.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.4.0"

[tasks.default]
description = "Run the default repository verification suite"
depends = ["check"]
run = "echo Safe Zone default checks passed."

[tasks.check]
description = "Run the standard local verification suite"
depends = ["go:lint", "go:test", "go:build", "eval:decision"]
run = "echo Safe Zone checks passed."

[tasks.ci]
description = "Run the CI verification suite"
# Composed from the same three groups ci.yml runs as separate jobs. The union is
# unchanged, so a developer running `mise run ci` locally still executes every
# gate exactly as before; the grouping exists so CI can hand each group a
# dedicated runner instead of running them all against one saturated vCPU set.
depends = ["ci:go", "ci:ui", "ci:ml"]
run = "echo Safe Zone CI checks passed."

[tasks."ci:go"]
description = "Run the Go gates: lint, build, race tests, coverage gate, security scans, decision evaluation, research CLI tests, environment documentation check"
depends = [
  "go:lint",
  "go:build",
  "go:test",
  "go:cover",
  "go:security",
  "eval:decision",
  "research:test",
  "check:env-docs",
]
run = "echo Safe Zone Go checks passed."

[tasks."ci:ui"]
description = "Run the UI gates: the embedded bundle check and the Playwright end-to-end suite"
# Deliberately the unsharded ui:e2e. The CI workflow does not use this task: it
# calls ui:e2e:shard directly with SAFE_ZONE_E2E_SHARD set, so that a developer
# running `mise run ci` locally still gets the whole suite in one piece and
# never hits the shard task's required-variable failure mode.
depends = ["ui:e2e"]
run = "echo Safe Zone UI checks passed."

[tasks."ci:ml"]
description = "Run the ML gates: create the pinned virtualenv and run pytest"
depends = ["ml:test"]
run = "echo Safe Zone ML checks passed."

[tasks."ui:install"]
description = "Install UI workspace dependencies"
run = "sh ./scripts/ops/ui.sh install"
run_windows = "pwsh -NoProfile -File scripts/ops/ui.ps1 install"

[tasks."ui:dev"]
description = "Start the React workspace dev server"
run = "sh ./scripts/ops/ui.sh dev"
run_windows = "pwsh -NoProfile -File scripts/ops/ui.ps1 dev"

[tasks."ui:build"]
description = "Build the React workspace into ui/dist"
run = "sh ./scripts/ops/ui.sh build"
run_windows = "pwsh -NoProfile -File scripts/ops/ui.ps1 build"

[tasks."ui:bundle"]
description = "Typecheck, build, and sync the React workspace into the embedded backend bundle"
run = "sh ./scripts/ops/ui.sh bundle"
run_windows = "pwsh -NoProfile -File scripts/ops/ui.ps1 bundle"
sources = [
  "ui/index.html",
  "ui/package.json",
  "ui/package-lock.json",
  "ui/src/**/*",
  "ui/tsconfig*.json",
  "ui/vite.config.ts",
  "ui/.oxlintrc.json",
  "ui/.prettierrc",
  "ui/.prettierignore",
  "scripts/ops/ui.ps1",
  "scripts/ops/ui.sh",
]
outputs = [
  "internal/api/app/dist/index.html",
]

[tasks."ui:preview"]
description = "Preview the production UI build locally"
run = "sh ./scripts/ops/ui.sh preview"
run_windows = "pwsh -NoProfile -File scripts/ops/ui.ps1 preview"

[tasks."ui:typecheck"]
description = "Run the UI TypeScript checks"
run = "sh ./scripts/ops/ui.sh typecheck"
run_windows = "pwsh -NoProfile -File scripts/ops/ui.ps1 typecheck"

[tasks."ui:check"]
description = "Run the UI verification suite without syncing the embedded bundle"
run = "sh ./scripts/ops/ui.sh check"
run_windows = "pwsh -NoProfile -File scripts/ops/ui.ps1 check"

[tasks."ui:e2e"]
description = "Build the API first, then run the UI E2E tests"
depends = ["go:build"]
run = "npm --prefix ui run test:e2e"
run_windows = "cmd.exe /c \"cd ui && npm run test:e2e\""

[tasks."ui:e2e:shard"]
description = "Run one shard of the UI E2E suite (set SAFE_ZONE_E2E_SHARD to N/TOTAL)"
# CI-only. The Playwright webServer starts core-api with `go run`, so it
# compiles what it needs and this task does not need go:build; the build gate
# lives in ci:go.
#
# Sharding is a scheduling change, not a behavioural one. Each shard runs on
# its own runner with its own webServer pair and its own in-memory SQLite, and
# workers stays at 1 inside a shard, so every shard executes a subset of the
# same tests in the same serial manner as the unsplit suite. Nothing about an
# individual test changes.
run = "npm --prefix ui run test:e2e -- --shard=$SAFE_ZONE_E2E_SHARD"

[tasks."go:test"]
description = "Run the Go test suite with the embedded UI bundle refreshed first"
depends = ["ui:bundle"]
# -race is non-negotiable here. This is a concurrent DNS resolver with a
# Redis-backed pub/sub config channel, so a data race is a correctness bug with
# a security consequence, not a flaky-test nuisance. The five most concurrent
# packages (risk, resolver, store, cache, ratelimit) were measured race-clean
# before this flag was added; the cost is CI time, roughly 33s to 185s on the
# risk suite, absorbed by the timeout on the quality job in ci.yml.
#
# The package list is explicit so the gitignored scratch code under tmp/ is
# not compiled. tmp/ holds throwaway replay harnesses, and lint deliberately
# excludes it (^tmp/ in .golangci.yml); building it anyway meant CI compiled
# code no linter ever saw. Anyone working in tmp/ still runs it directly with
# go run or go test ./tmp/... -- this only stops the shared gates from
# depending on scratch.
run = "go test -race -coverprofile=coverage.out ./cmd/... ./internal/... ./ml/..."

[tasks."go:build"]
description = "Build all Go packages with the embedded UI bundle refreshed first"
depends = ["ui:bundle"]
# Explicit package list for the same reason as go:test: tmp/ is gitignored
# scratch and must not be part of what the shared gates compile.
run = "go build ./cmd/... ./internal/... ./ml/..."

[tasks."go:cover"]
description = "Fail when total Go coverage drops below the gate (SAFE_ZONE_COVER_THRESHOLD, default 65)"
# Depends on go:test (which writes coverage.out) instead of re-running the
# suite: the CI graph runs tasks in parallel, and a second full -race suite
# starves golangci-lint of CPU until its 5m timeout trips.
depends = ["go:test"]
env = { SAFE_ZONE_COVER_RUN_TESTS = "0" }
run = "sh ./scripts/ops/coverage.sh"
run_windows = "pwsh -NoProfile -File scripts/ops/coverage.ps1"

[tasks."research:build"]
description = "Build the ML research CLIs under tools/ (kept out of the production ./cmd/... gate)"
run = "go build ./tools/..."

[tasks."research:test"]
description = "Test the ML research CLIs under tools/"
run = "go test -race ./tools/..."

[tasks."check:env-docs"]
description = "Verify that every SAFE_ZONE_* setting read by the code is documented in .env.example"
run = "go run ./tools/env-docs-check -repo-root ."

[tasks."go:lint"]
description = "Run the Go linter"
# Must run after ui:bundle: the linter typechecks internal/api/app, whose
# //go:embed all:dist fails while the bundle task is wiping and
# re-copying dist/. Without this edge the check raced the bundle on a
# fresh runner and failed spuriously (main CI, 2026-10-10).
depends = ["ui:bundle"]
run = "golangci-lint run"

[tasks."eval:decision"]
description = "Run the frozen offline decision evaluation (truth + contract corpora)"
run = [
  "go run ./cmd/eval-decision check --corpus internal/eval/testdata/corpus.v2.json --expected internal/eval/testdata/expected.v2.json",
  "go run ./cmd/eval-decision check --corpus internal/eval/testdata/contract.v1.json --expected internal/eval/testdata/expected-contract.v1.json",
  "go run ./cmd/eval-decision check --corpus internal/eval/testdata/corpus-fpguard.v1.json --expected internal/eval/testdata/expected-fpguard.v1.json",
  "go run ./cmd/eval-decision check --corpus internal/eval/testdata/contract-fpguard.v1.json --expected internal/eval/testdata/expected-contract-fpguard.v1.json",
]

[tasks."go:security"]
description = "Run the Go security scans used in CI"
# Same embed race as go:lint: gosec and govulncheck typecheck
# internal/api/app, whose //go:embed all:dist fails while ui:bundle is
# wiping and re-copying dist/. Main CI hit this on 2026-10-28 after the
# bundle task raced gosec on a fresh runner.
depends = ["ui:bundle"]
run = [
  "gosec ./...",
  "govulncheck ./...",
]

[tasks."ml:install"]
description = "Create the ML virtualenv and install the pinned dependencies from ml/pyproject.toml"
run = "python -m venv ml/.venv && ml/.venv/bin/python -m pip install --quiet --upgrade pip && ml/.venv/bin/python -m pip install --quiet './ml[dev]'"
run_windows = 'python -m venv ml\.venv; if not exist ml\.venv\Scripts\python.exe exit /b 1; ml\.venv\Scripts\python.exe -m pip install --quiet --upgrade pip; ml\.venv\Scripts\python.exe -m pip install --quiet "ml[dev]"'

[tasks."ml:test"]
description = "Run the ML test suite (pytest over ml/tests)"
depends = ["ml:install"]
run = "cd ml && .venv/bin/python -m pytest -q"
run_windows = 'cmd.exe /c "cd ml && .venv\Scripts\python.exe -m pytest -q"'

[tasks."ops:deploy"]
description = "Deploy the production compose stack through the standardized ops entrypoint"
run = "SAFE_ZONE_SKIP_MISE=1 sh ./scripts/ops/safe-zone.sh deploy"
run_windows = "$env:SAFE_ZONE_SKIP_MISE='1'; pwsh -NoProfile -File scripts/ops/safe-zone.ps1 deploy"

[tasks."ops:deploy-dev"]
description = "Deploy the developer compose stack through the standardized ops entrypoint"
run = "SAFE_ZONE_SKIP_MISE=1 sh ./scripts/ops/safe-zone.sh deploy-dev"
run_windows = "$env:SAFE_ZONE_SKIP_MISE='1'; pwsh -NoProfile -File scripts/ops/safe-zone.ps1 deploy-dev"

[tasks."ops:status"]
description = "Show compose status and health checks through the standardized ops entrypoint"
run = "SAFE_ZONE_SKIP_MISE=1 sh ./scripts/ops/safe-zone.sh status"
run_windows = "$env:SAFE_ZONE_SKIP_MISE='1'; pwsh -NoProfile -File scripts/ops/safe-zone.ps1 status"

[tasks."ops:logs"]
description = "Follow compose logs through the standardized ops entrypoint"
run = "SAFE_ZONE_SKIP_MISE=1 sh ./scripts/ops/safe-zone.sh logs"
run_windows = "$env:SAFE_ZONE_SKIP_MISE='1'; pwsh -NoProfile -File scripts/ops/safe-zone.ps1 logs"

[tasks."ops:backup"]
description = "Create a Safe Zone backup through the standardized ops entrypoint"
run = "SAFE_ZONE_SKIP_MISE=1 sh ./scripts/ops/safe-zone.sh backup"
run_windows = "$env:SAFE_ZONE_SKIP_MISE='1'; pwsh -NoProfile -File scripts/ops/safe-zone.ps1 backup"

[tasks."ops:restore"]
description = "Restore a Safe Zone backup through the standardized ops entrypoint"
run = "SAFE_ZONE_SKIP_MISE=1 sh ./scripts/ops/safe-zone.sh restore"
run_windows = "$env:SAFE_ZONE_SKIP_MISE='1'; pwsh -NoProfile -File scripts/ops/safe-zone.ps1 restore"

[tasks."ops:prune"]
description = "Prune retained backups and log files through the standardized ops entrypoint"
run = "SAFE_ZONE_SKIP_MISE=1 sh ./scripts/ops/safe-zone.sh prune"
run_windows = "$env:SAFE_ZONE_SKIP_MISE='1'; pwsh -NoProfile -File scripts/ops/safe-zone.ps1 prune"

[tasks."ops:rotate-secrets"]
description = "Rotate core-api admin password and API key in the compose .env (backup, verify, rollback)"
run = "sh ./scripts/ops/rotate-admin-secrets.sh"
run_windows = "pwsh -NoProfile -File scripts/ops/rotate-admin-secrets.ps1"

[tasks."ops:feed-sync"]
description = "Run the feed sync helper through the standardized ops entrypoint"
run = "SAFE_ZONE_SKIP_MISE=1 sh ./scripts/ops/safe-zone.sh feed-sync"
run_windows = "$env:SAFE_ZONE_SKIP_MISE='1'; pwsh -NoProfile -File scripts/ops/safe-zone.ps1 feed-sync"

[tasks."ops:ml-provision"]
description = "Validate and activate a versioned ML bundle through the Phase 5 provisioning helper"
run = "sh ./scripts/ops/ml-bundle.sh provision"
run_windows = "pwsh -NoProfile -File scripts/ops/ml-bundle.ps1 provision"

[tasks."ops:ml-validate"]
description = "Validate the active ML bundle without changing deployment state"
run = "sh ./scripts/ops/ml-bundle.sh validate"
run_windows = "pwsh -NoProfile -File scripts/ops/ml-bundle.ps1 validate"

[tasks."ops:ml-rollback"]
description = "Activate a previously provisioned ML bundle version"
run = "sh ./scripts/ops/ml-bundle.sh rollback"
run_windows = "pwsh -NoProfile -File scripts/ops/ml-bundle.ps1 rollback"

[tasks."ml:url-shadow-replay"]
description = "Replay frozen labelled URL evidence through a running shadow core API"
run = "python ml/src/replay_v10_url_shadow.py --base-url http://127.0.0.1:8080 --workers 12"

[tasks."ml:url-shadow-rollback-check"]
description = "Verify that URL ML rollback is disabled and domain-response safe"
run = "python ml/src/check_v10_url_rollback.py --base-url http://127.0.0.1:8080"
