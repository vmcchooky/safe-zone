  /v1/policy:
    get:
      tags: [DNS]
      operationId: getPolicy
      security: []
      summary: Evaluate the DNS policy for a domain (served by dns-resolver)
      description: >
        Returns the policy action plus the security verdict assessed
        independently. When SAFE_ZONE_POLICY_SEMANTICS=separated, an adblock
        match carries a decision object (reason=adblock_match,
        assessment_mode=lexical_local_default_brands) while the security
        result stays lexical-local. A scoped content exception suppresses the
        adblock block instead (reason=adblock_exception,
        assessment_mode=full_security_pipeline) and the request continues
        through the full security pipeline; the overall policy still follows
        the security verdict. The optional shadow exact/suffix observation
        (SAFE_ZONE_ADBLOCK_SHADOW_EXACT_ENABLED) only counts prospective
        outcomes into status aggregates and never changes this response.
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Policy decision and security result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
  /dns-query:
    get:
      tags: [DNS]
      operationId: dohQueryGet
      security: []
      summary: DNS-over-HTTPS query using RFC 8484 GET
      parameters:
        - name: dns
          in: query
          required: true
          schema:
            type: string
          description: Base64url-encoded DNS wire-format message (RFC 8484 §4.1).
        - name: client_id
          in: query
          required: false
          schema:
            type: string
          description: Optional per-client policy identity; the /dns-query/{client_id} path form is equivalent.
      responses:
        "200":
          description: DNS wire-format response
          content:
            application/dns-message:
              schema:
                type: string
                format: binary
        "400":
          description: Missing dns parameter or malformed message
        "415":
          description: Unsupported media type (POST only)
    post:
      tags: [DNS]
      operationId: dohQueryPost
      security: []
      summary: DNS-over-HTTPS query using RFC 8484 POST
      requestBody:
        required: true
        content:
          application/dns-message:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: DNS wire-format response
          content:
            application/dns-message:
              schema:
                type: string
                format: binary
        "400":
          description: Empty or malformed message
        "413":
          description: DNS message exceeds 65535 bytes
        "415":
          description: Content-Type must be application/dns-message
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: admin_session
    apiKeyAuth:
      type: http
      scheme: bearer
      description: Use `Bearer <SAFE_ZONE_ADMIN_API_KEY>`.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      description: Plain-text error payload returned by non-2xx JSON responses.
    Analysis:
      type: object
      properties:
        domain:
          type: string
        verdict:
          type: string
          enum: [INVALID, SAFE, SUSPICIOUS, MALICIOUS]
        confidence:
          type: number
        score:
          type: integer
        reasons:
          type: array
          items:
            type: string
        category:
          type: string
        cache_hit:
          type: boolean
        analyzed_at:
          type: string
          format: date-time
    StatusResponse:
      type: object
      description: Aggregated dashboard status; fields are additive and service-dependent.
      properties:
        service: {type: string}
        cache:
          type: object
          description: Redis connectivity and eviction-safety state.
        feed:
          type: object
          description: Threat feed freshness and member counts.
        adblock:
          type: object
          description: Adblock trie state, match mode, and per-source fingerprints.
        decision_pipeline:
          type: object
          description: Pipeline counters including outbound_proxy_enabled.
        agent:
          type: object
          description: Background agent task summary.
      additionalProperties: true
    Brand:
      type: object
      required: [name, official_domain]
      properties:
        id: {type: integer}
        name:
          type: string
          example: google
        official_domain:
          type: string
          example: google.com
        alt_domains:
          type: array
          items:
            type: string
          example: ["google.com.vn", "google.co.uk"]
        created_at: {type: string}
        updated_at: {type: string}
    BrandList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Brand"
    Group:
      type: object
      required: [name]
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        block_categories:
          type: array
          items:
            type: string
        strict_phishing: {type: boolean}
        strict_malware: {type: boolean}
    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Group"
    ClientMapping:
      type: object
      required: [mapping_type, value, group_id]
      properties:
        id: {type: integer}
        mapping_type:
          type: string
          enum: [ip, cidr, client_id]
        value:
          type: string
          description: IP address, CIDR range, or client identifier.
        group_id: {type: integer}
    MappingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientMapping"
    GroupOverride:
      type: object
      required: [group_id, domain, action]
      properties:
        id: {type: integer}
        group_id: {type: integer}
        domain: {type: string}
        action:
          type: string
          enum: [allow, block]
        reason: {type: string}
    GroupOverrideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupOverride"
    AgentProposal:
      type: object
      properties:
        id: {type: integer}
        domain: {type: string}
        action:
          type: string
          enum: [block, allow]
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        confidence: {type: number}
        reasons:
          type: array
          items:
            type: string
        created_at: {type: string}
        decided_at: {type: string}
    AgentProposalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentProposal"
    WhitelistSnapshot:
      type: object
      properties:
        id: {type: string}
        created_at: {type: string}
        entry_count: {type: integer}
        reason: {type: string}
    WhitelistSnapshotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WhitelistSnapshot"
    PolicyDecision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [allow, block]
        kind:
          type: string
          description: Decision axis, e.g. "content" for content/DNS policy.
        category:
          type: string
          description: >
            Content category driving the decision. "unknown" when the merged
            feed source does not carry per-entry classification evidence.
        reason:
          type: string
          description: Machine-readable reason, e.g. "adblock_match" or "adblock_exception".
        source:
          type: string
          description: Rule system that produced the decision, e.g. "adblock".
        assessment_mode:
          type: string
          description: >
            How the attached security Result was assessed for this decision.
            "lexical_local_default_brands" means only the in-process lexical
            analyzer ran against the built-in brand seed, with no backend
            I/O; it is explicitly not a full security assessment.
            "full_security_pipeline" means a scoped content exception
            suppressed the adblock block and the security Result ran the full
            pipeline instead.
        matched_rule:
          type: string
          description: >
            Normalized domain of the adblock rule that fired (e.g.
            "ads.example.com").
        match_type:
          type: string
          enum: [exact, suffix]
          description: >
            Rule scope. Exact rules match only the recorded domain; suffix
            rules also match every subdomain.
        source_id:
          type: string
          description: >
            Stable digest of the blocklist source that contributed the rule
            ("legacy" for legacy adds, "legacy-cache" for pre-v2 cache
            reloads). The source URL itself is never exposed.
        exception_id:
          type: string
          description: >
            Operator-configured scoped content exception that suppressed the
            adblock match. Present only on adblock_exception decisions; the
            config reason behind it is never exposed.
    PolicyResponse:
      type: object
      description: dns-resolver GET /v1/policy response (service + risk.Policy + meta).
      properties:
        service:
          type: string
        domain:
          type: string
        policy:
          type: string
          enum: [allow, block]
        result:
          type: object
          properties:
            domain:
              type: string
            verdict:
              type: string
              enum: [INVALID, SAFE, SUSPICIOUS, MALICIOUS]
            confidence:
              type: number
            score:
              type: integer
            reasons:
              type: array
              items:
                type: string
            category:
              type: string
        decision:
          $ref: "#/components/schemas/PolicyDecision"
        cache_hit:
          type: boolean
        meta:
          type: object
          additionalProperties:
            type: string
    OverrideRequest:
      type: object
      required: [domain, action]
      properties:
        domain:
          type: string
        action:
          type: string
          enum: [allow, block]
        reason:
          type: string
    BlockReport:
      type: object
      required: [id, domain, contact, note, status, created_at, review_reason, reviewed_by, reviewed_at, resolution_action]
      properties:
        id: {type: integer}
        domain: {type: string}
        contact: {type: string}
        note: {type: string}
        status:
          type: string
          enum: [pending, resolved, rejected]
        created_at: {type: string}
        review_reason: {type: string}
        reviewed_by: {type: string}
        reviewed_at: {type: string}
        resolution_action:
          type: string
          enum: ["", allow, resolve, reject]
    BlockReportRequest:
      type: object
      required: [domain]
      properties:
        domain: {type: string}
        contact: {type: string}
        note: {type: string}
    BlockReportStatusCounts:
      type: object
      required: [pending, resolved, rejected]
      properties:
        pending: {type: integer, minimum: 0}
        resolved: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
    AnalysisConfig:
      type: object
      required:
        - punycode_score
        - long_domain_length
        - long_domain_score
        - hyphen_count_threshold
        - hyphen_score
        - digit_ratio_threshold
        - digit_ratio_score
        - mixed_script_score
        - keywords
        - keyword_base_score
        - keyword_match_score
        - keyword_multiple_bonus
        - brand_spoofing_score
        - entropy_threshold
        - entropy_score
      properties:
        punycode_score: {type: integer, minimum: 0, maximum: 100}
        long_domain_length: {type: integer, minimum: 10, maximum: 253}
        long_domain_score: {type: integer, minimum: 0, maximum: 100}
        hyphen_count_threshold: {type: integer, minimum: 1, maximum: 20}
        hyphen_score: {type: integer, minimum: 0, maximum: 100}
        digit_ratio_threshold: {type: number, minimum: 0, maximum: 1}
        digit_ratio_score: {type: integer, minimum: 0, maximum: 100}
        mixed_script_score: {type: integer, minimum: 0, maximum: 100}
        keywords:
          type: array
          minItems: 1
          maxItems: 200
          items: {type: string, maxLength: 64}
        keyword_base_score: {type: integer, minimum: 0, maximum: 100}
        keyword_match_score: {type: integer, minimum: 0, maximum: 100}
        keyword_multiple_bonus: {type: integer, minimum: 0, maximum: 100}
        brand_spoofing_score: {type: integer, minimum: 0, maximum: 100}
        entropy_threshold: {type: number, minimum: 0, maximum: 8}
        entropy_score: {type: integer, minimum: 0, maximum: 100}
