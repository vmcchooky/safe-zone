openapi: 3.1.0
info:
  title: Safe Zone API
  version: 0.2.0
  description: |
    Local-first anti-phishing API for domain analysis, policy checks, telemetry, and administration.

    One document covers both services. core-api serves every `/v1/*` path below except
    `/v1/policy` and `/dns-query`, which belong to dns-resolver (published on 127.0.0.1:8081
    in the developer stack, fronted by Caddy in production). The parity between this
    document and the registered routes is asserted by `go test ./internal/openapi/`,
    which diffs the route tables in `internal/api/server/routes.go` and
    `internal/dns/server/routes.go` against these paths.

    Authentication: dashboard sessions use the `admin_session` cookie (CSRF-checked for
    state-changing requests); machine callers send `Authorization: Bearer
    <SAFE_ZONE_ADMIN_API_KEY>`. Read-only guest sessions may read any endpoint that only
    requires authentication; writes additionally require the admin role.
servers:
  - url: https://{host}
    variables:
      host:
        default: safezone.example.com
  - url: http://localhost:8080
tags:
  - name: System
    description: Health, readiness, version, status, metrics, and log export.
  - name: Analysis
    description: Domain analysis pipeline, raw data, OSINT evidence, cache control.
  - name: Auth
    description: Dashboard session lifecycle.
  - name: Overrides
    description: Operator allow/block overrides and false-positive review.
  - name: Reports
    description: User-submitted block reports.
  - name: Brands
    description: Trusted brand rules for typosquat detection.
  - name: Groups
    description: Policy groups, client mappings, and group overrides.
  - name: Settings
    description: Runtime settings, guest access, and connectivity tests.
  - name: Config
    description: Lexical analysis configuration.
  - name: Agent
    description: Background agent status, triggers, and reviewable proposals.
  - name: Whitelist
    description: Whitelist snapshots and rollback.
  - name: Telemetry
    description: Analysis telemetry for the dashboard.
  - name: BlockPage
    description: Public block page and report submission.
  - name: DNS
    description: dns-resolver endpoints (DNS-over-HTTPS and the policy decision).
paths:
  /:
    get:
      tags: [DNS]
      operationId: getResolverStatus
      security: []
      summary: Resolver status snapshot (served by dns-resolver)
      description: |
        Service-local status for the resolver: cache occupancy, upstream pool
        health and pipeline counters. core-api has no equivalent free-form
        root route; its status lives at /v1/status.
      responses:
        "200":
          description: Resolver status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /healthz:
    get:
      tags: [System]
      operationId: getHealthz
      security: []
      summary: Health check (liveness)
      description: Served by both core-api (8080) and dns-resolver (8081); pure liveness, no dependency checks.
      responses:
        "200":
          description: Service is healthy
  /readyz:
    get:
      tags: [System]
      operationId: getReadyz
      security: []
      summary: Readiness check
      description: Served by both services; returns 503 while the service cannot do its job (dependencies down, ML bundle required but missing).
      responses:
        "200":
          description: Service is ready
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Internal JSON metrics (admin only)
      description: |
        Per-endpoint request summary (method, path, status, counts, latency) plus cache and
        pipeline counters. Admin-only on both services: the summary lets a caller
        fingerprint the API surface and read 401/403/429 rates. dns-resolver gates this
        with the bearer admin key only (no session cookies) and fails closed when no key
        is configured.
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: Metrics snapshot
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /metrics/prometheus:
    get:
      tags: [System]
      operationId: getMetricsPrometheus
      summary: Prometheus exposition of the same metrics (admin only, core-api)
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/status:
    get:
      tags: [System]
      operationId: getStatus
      summary: Aggregated service status for the dashboard
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Pipeline, cache, feed, adblock and agent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/version:
    get:
      tags: [System]
      operationId: getVersion
      security: []
      summary: Build metadata
      description: Served by both services.
      responses:
        "200":
          description: Version, commit, build time
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: string}
                  git_commit: {type: string}
                  build_time: {type: string}
  /v1/cache/flush:
    post:
      tags: [Analysis]
      operationId: flushCaches
      summary: Flush the analysis caches (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Cache flush accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/logs/export:
    get:
      tags: [System]
      operationId: exportLogs
      summary: Export recent request logs (admin)
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: Log lines as a text/plain attachment
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/analyze:
    get:
      tags: [Analysis]
      operationId: analyzeDomain
      security: []
      summary: Analyze a domain
      description: Public; authentication is optional and only gates force_osint (outbound OSINT evidence).
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
        - name: include_evidence
          in: query
          schema:
            type: string
            enum: ["0", "1"]
        - name: force_osint
          in: query
          description: Requires authentication; ignored for anonymous callers.
          schema:
            type: string
            enum: ["0", "1"]
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          description: Missing or invalid domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Analysis]
      operationId: analyzeDomainBody
      summary: Analyze a domain from JSON body
      security:
        - {}
        - cookieAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                requested_url:
                  type: string
                redirect_chain:
                  type: array
                  items:
                    type: string
                event_id:
                  type: string
                  description: Opaque caller-generated correlation ID for privacy-safe label feedback.
                caller_class:
                  type: string
                  enum: [ui, sdk, extension, proxy, other]
                force_osint:
                  type: boolean
                  description: Requires authentication; ignored for anonymous callers.
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          description: Invalid JSON body or domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/analyze/raw:
    get:
      tags: [Analysis]
      operationId: getRawAnalysisData
      summary: Raw analysis pipeline data for one domain
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Raw pipeline layers (feed, lexical, overrides, groups, ML)
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/osint/evidence:
    get:
      tags: [Analysis]
      operationId: getOsintEvidence
      summary: Public OSINT evidence for one domain
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence entries from the configured OSINT sources
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/analysis/recent:
    get:
      tags: [Analysis]
      operationId: getRecentAnalyses
      summary: List recent analysis results
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Recent analysis entries
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/url-ml/feedback:
    post:
      tags: [Analysis]
      operationId: submitUrlMLFeedback
      summary: Submit a URL-ML label for feedback
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                label:
                  type: string
                url:
                  type: string
      responses:
        "200":
          description: Feedback accepted
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Login to dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                username:
                  type: string
                  description: Admin username; defaults to `admin`.
                password:
                  type: string
      responses:
        "200":
          description: Login successful; sets the admin_session cookie
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Logout from dashboard
      description: Revokes the persisted session; CSRF-checked when called with the session cookie.
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Logout successful
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Inspect the current session
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Session role and expiry
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                    enum: [admin, guest]
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/overrides:
    get:
      tags: [Overrides]
      operationId: listOverrides
      summary: List global overrides
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
            enum: [allow, block]
      responses:
        "200":
          description: Override list
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Overrides]
      operationId: upsertOverride
      summary: Create or update a global override (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideRequest"
      responses:
        "200":
          description: Override saved
        "400":
          description: Invalid override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Overrides]
      operationId: deleteOverride
      summary: Delete a global override (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Override deleted
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/overrides/review-false-positive:
    post:
      tags: [Overrides]
      operationId: reviewFalsePositive
      summary: Resolve a false positive by converting a domain to an allow override (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, reason]
              properties:
                report_id:
                  type: integer
                  minimum: 1
                  description: Optional queue report identifier; required for queue-originated reviews.
                domain:
                  type: string
                reason:
                  type: string
                  minLength: 8
                source:
                  type: string
                previous_action:
                  type: string
      responses:
        "200":
          description: False-positive review applied
        "404":
          description: Queue report was not found
        "409":
          description: Queue report domain does not match the requested domain
  /v1/reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: List false-positive reports for operator review (admin)
      description: Admin-only because report contact and note fields may contain personal data.
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, resolved, rejected]
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated report queue plus global status counts
          content:
            application/json:
              schema:
                type: object
                required: [reports, total, counts, filter]
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlockReport"
                  total:
                    type: integer
                  counts:
                    $ref: "#/components/schemas/BlockReportStatusCounts"
                  filter:
                    type: object
                    properties:
                      status: {type: string}
                      q: {type: string}
        "403":
          description: Authenticated user is not an admin
  /v1/reports/status:
    post:
      tags: [Reports]
      operationId: updateReportStatus
      summary: Resolve or reject a false-positive report without creating an override (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status, reason]
              properties:
                id:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum: [resolved, rejected]
                reason:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Operator decision and audit event committed
        "404":
          description: Queue report was not found
  /v1/brands:
    get:
      tags: [Brands]
      operationId: listBrands
      summary: List trusted brand rules
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: When present, return that single brand instead of the list.
      responses:
        "200":
          description: Brand list (or a single brand when id is given)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BrandList"
                  - $ref: "#/components/schemas/Brand"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Brands]
      operationId: createBrand
      summary: Create a brand rule (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Brand"
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Invalid brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Brands]
      operationId: updateBrand
      summary: Update a brand rule (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Brand"
      responses:
        "200":
          description: Brand updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Brands]
      operationId: deleteBrand
      summary: Delete a brand rule (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Brand deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  id: {type: integer}
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/groups:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: List policy groups
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create a policy group (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "201":
          description: Group created
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Groups]
      operationId: updateGroup
      summary: Update a policy group (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group updated
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete a policy group (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group deleted
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mappings:
    get:
      tags: [Groups]
      operationId: listMappings
      summary: List client mappings (IP or client_id to group)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Mapping list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappingList"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Groups]
      operationId: createMapping
      summary: Create a client mapping (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientMapping"
      responses:
        "201":
          description: Mapping created
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Groups]
      operationId: deleteMapping
      summary: Delete a client mapping (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mapping deleted
        "404":
          description: Mapping not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/group-overrides:
    get:
      tags: [Groups]
      operationId: listGroupOverrides
      summary: List per-group domain overrides
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Group override list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupOverrideList"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Groups]
      operationId: createGroupOverride
      summary: Create a group override (admin)
      security:
        - cookieAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
