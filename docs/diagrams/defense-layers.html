<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Six layers, one decision · Defense layers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FAF8F3;
      --color-paper-2: #F4F0E8;
      --color-ink:     #3A3530;
      --color-muted:   #5C544B;
      --color-accent:  #2E5A46;
      --color-accent-tint: #58A67A1A;
      --color-link:    #2F4A8F;
      --color-hairline: #E3D9CB;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">LAYER STACK - DEFENSE</p>
    <h1>Six layers, one decision.</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="defense-layers-title defense-layers-desc">
      <title id="defense-layers-title">Six layers, one decision.</title>
      <desc id="defense-layers-desc">Six compensating defense layers narrow an untrusted URL or domain to one policy verdict, while unknown verdicts and URL-only IOCs stay contextual.</desc>

      <rect width="100%" height="100%" fill="#FAF8F3"/>

      <!-- Threat input -->
      <text x="140" y="36" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">UNTRUSTED INPUT &#8212; URL / DOMAIN</text>
      <line x1="520" y1="44" x2="520" y2="64" stroke="#5C544B" stroke-width="1"/>
      <polygon points="516,64 524,64 520,72" fill="#5C544B"/>

      <!-- Direction rail (left margin): first seen top, enforced bottom -->
      <text x="52" y="68" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FIRST SEEN</text>
      <line x1="76" y1="76" x2="76" y2="436" stroke="#5C544B" stroke-opacity="0.35" stroke-width="1"/>
      <polygon points="72,436 80,436 76,444" fill="#5C544B"/>
      <text x="56" y="460" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ENFORCED</text>

      <!-- Stack outer top edge -->
      <line x1="140" y1="76" x2="920" y2="76" stroke="#E3D9CB" stroke-width="1"/>

      <!-- L1 Lexical -->
      <rect x="140" y="76" width="780" height="60" fill="#FAF8F3"/>
      <text x="160" y="112" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="212" y="114" fill="#3A3530" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Lexical</text>
      <text x="900" y="114" fill="#5C544B" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">typosquat / brand / DGA &#183; always on</text>
      <line x1="140" y1="136" x2="920" y2="136" stroke="#E3D9CB" stroke-width="1"/>

      <!-- L2 Threat feed -->
      <rect x="140" y="136" width="780" height="60" fill="#F4F0E8"/>
      <text x="160" y="172" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="212" y="174" fill="#3A3530" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Threat feed</text>
      <text x="900" y="174" fill="#5C544B" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">exact + parent walk &#183; revisioned</text>
      <line x1="140" y1="196" x2="920" y2="196" stroke="#E3D9CB" stroke-width="1"/>

      <!-- L3 TLS / WHOIS enrichment -->
      <rect x="140" y="196" width="780" height="60" fill="#FAF8F3"/>
      <text x="160" y="232" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="212" y="234" fill="#3A3530" font-size="15" font-weight="600" font-family="'Geist', sans-serif">TLS / WHOIS enrichment</text>
      <text x="900" y="234" fill="#5C544B" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">background &#183; corroboration only</text>
      <line x1="140" y1="256" x2="920" y2="256" stroke="#E3D9CB" stroke-width="1"/>

      <!-- L4 Domain ML -->
      <rect x="140" y="256" width="780" height="60" fill="#F4F0E8"/>
      <text x="160" y="292" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
      <text x="212" y="294" fill="#3A3530" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Domain ML</text>
      <text x="900" y="294" fill="#5C544B" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">disabled / shadow &#183; gated</text>
      <line x1="140" y1="316" x2="920" y2="316" stroke="#E3D9CB" stroke-width="1"/>

      <!-- L5 OSINT / AI -->
      <rect x="140" y="316" width="780" height="60" fill="#FAF8F3"/>
      <text x="160" y="352" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
      <text x="212" y="354" fill="#3A3530" font-size="15" font-weight="600" font-family="'Geist', sans-serif">OSINT / AI</text>
      <text x="900" y="354" fill="#5C544B" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">advisory &#183; never sole verdict</text>
      <line x1="140" y1="376" x2="920" y2="376" stroke="#E3D9CB" stroke-width="1"/>

      <!-- L6 Policy enforcement (FOCAL) -->
      <rect x="140" y="376" width="780" height="60" fill="#58A67A1A"/>
      <rect x="140" y="376" width="780" height="60" fill="none" stroke="#2E5A46" stroke-width="2"/>
      <text x="160" y="412" fill="#2E5A46" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L6</text>
      <text x="212" y="414" fill="#3A3530" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Policy enforcement</text>
      <text x="900" y="414" fill="#2E5A46" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">FOCAL &#183; block / allow + category</text>

      <!-- Residual carriers: misses pass down through each divider -->
      <polygon points="512,128 528,128 520,136" fill="#5C544B"/>
      <polygon points="512,188 528,188 520,196" fill="#5C544B"/>
      <polygon points="512,248 528,248 520,256" fill="#5C544B"/>
      <polygon points="512,308 528,308 520,316" fill="#5C544B"/>
      <polygon points="512,368 528,368 520,376" fill="#5C544B"/>

      <!-- Verdict: one decision out of the focal layer -->
      <line x1="520" y1="436" x2="520" y2="456" stroke="#2E5A46" stroke-width="1"/>
      <polygon points="516,456 524,456 520,464" fill="#2E5A46"/>
      <rect x="320" y="464" width="400" height="40" rx="8" fill="#F4F0E8" stroke="#E3D9CB" stroke-width="1"/>
      <text x="520" y="489" fill="#3A3530" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">one decision &#8212; block / allow + category</text>

      <!-- Residual aside (not a layer) -->
      <rect x="140" y="520" width="780" height="60" rx="8" fill="#FAF8F3" stroke="#E3D9CB" stroke-width="1" stroke-dasharray="8 4"/>
      <text x="160" y="544" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">RESIDUAL &#8212; ASIDE, NOT A LAYER</text>
      <text x="160" y="564" fill="#3A3530" font-size="13" font-family="'Geist', sans-serif">Unknown verdicts + URL-only IOCs stay contextual &#8212; watched, never silent-allowed.</text>

      <!-- Bottom legend -->
      <rect x="140" y="600" width="12" height="12" fill="#F4F0E8" stroke="#E3D9CB" stroke-width="1"/>
      <text x="160" y="610" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">detection layer</text>
      <rect x="300" y="600" width="12" height="12" fill="#58A67A1A" stroke="#2E5A46" stroke-width="1"/>
      <text x="320" y="610" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">focal = enforcement</text>
      <polygon points="452,600 464,600 458,612" fill="#5C544B"/>
      <text x="472" y="610" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">miss passes down</text>
      <rect x="620" y="600" width="12" height="12" fill="none" stroke="#5C544B" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="640" y="610" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">residual aside</text>

    </svg>
  </div>
</body>
</html>
