<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One VPS, three trust zones</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FAF8F3;
      --color-paper-2: #F4F0E8;
      --color-ink:     #3A3530;
      --color-muted:   #5C544B;
      --color-accent:  #2E5A46;
      --color-link:    #2F4A8F;
      --color-hairline:#E3D9CB;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">DEPLOYMENT - SINGLE VPS</p>
    <h1>One VPS, three trust zones.</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-title deployment-desc">
      <title id="deployment-title">One VPS, three trust zones</title>
      <desc id="deployment-desc">Single VPS places Caddy and DoT in public, core-api and dns-resolver on loopback, and Redis with SQLite data inside.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C544B"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E5A46"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2F4A8F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FAF8F3"/>

      <!-- Zones (drawn first, before arrows and nodes) -->
      <rect x="140" y="76" width="240" height="420" rx="8" fill="rgba(58,53,48,0.02)" stroke="rgba(58,53,48,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="156" y="80" width="64" height="12" fill="#FAF8F3"/>
      <text x="188" y="89" fill="#5C544B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PUBLIC</text>

      <rect x="412" y="76" width="272" height="420" rx="8" fill="rgba(58,53,48,0.02)" stroke="rgba(58,53,48,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="428" y="80" width="84" height="12" fill="#FAF8F3"/>
      <text x="470" y="89" fill="#5C544B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOOPBACK</text>

      <rect x="716" y="76" width="244" height="420" rx="8" fill="rgba(58,53,48,0.02)" stroke="rgba(58,53,48,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="732" y="80" width="72" height="12" fill="#FAF8F3"/>
      <text x="768" y="89" fill="#5C544B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INTERNAL</text>

      <!-- External actor (label only, not a node) -->
      <text x="28" y="286" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">INTERNET</text>

      <!-- Network paths (behind nodes, orthogonal elbows r=8) -->
      <line x1="70" y1="182" x2="164" y2="182" stroke="#2F4A8F" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="70" y1="374" x2="164" y2="374" stroke="#2F4A8F" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="356" y1="160" x2="436" y2="160" stroke="#2F4A8F" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 356,216 H 388 Q 396,216 396,224 V 364 Q 396,372 404,372 H 436" fill="none" stroke="#2F4A8F" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 660,196 H 684 Q 692,196 692,204 V 344 Q 692,352 700,352 H 740" fill="none" stroke="#2F4A8F" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="660" y1="396" x2="740" y2="396" stroke="#2F4A8F" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="660" y1="152" x2="740" y2="152" stroke="#2F4A8F" stroke-width="1.2" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
      <path d="M 660,340 H 700 Q 708,340 708,332 V 216 Q 708,208 716,208 H 740" fill="none" stroke="#2F4A8F" stroke-width="1.2" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>

      <!-- Path labels (opaque masks, 6px+ gap off the stroke) -->
      <rect x="85" y="162" width="64" height="12" rx="2" fill="#FAF8F3"/>
      <text x="117" y="171" fill="#2F4A8F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">:80/:443</text>

      <rect x="85" y="354" width="64" height="12" rx="2" fill="#FAF8F3"/>
      <text x="117" y="363" fill="#2F4A8F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DOT :853</text>

      <rect x="360" y="140" width="72" height="12" rx="2" fill="#FAF8F3"/>
      <text x="396" y="149" fill="#2F4A8F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP :8080</text>

      <rect x="404" y="288" width="72" height="12" rx="2" fill="#FAF8F3"/>
      <text x="440" y="297" fill="#2F4A8F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP :8081</text>

      <rect x="628" y="288" width="56" height="12" rx="2" fill="#FAF8F3"/>
      <text x="656" y="297" fill="#2F4A8F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQLITE</text>

      <rect x="672" y="378" width="56" height="12" rx="2" fill="#FAF8F3"/>
      <text x="700" y="387" fill="#2F4A8F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQLITE</text>

      <rect x="664" y="132" width="72" height="12" rx="2" fill="#FAF8F3"/>
      <text x="700" y="141" fill="#2F4A8F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDIS:6379</text>

      <rect x="716" y="268" width="72" height="12" rx="2" fill="#FAF8F3"/>
      <text x="752" y="277" fill="#2F4A8F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDIS:6379</text>

      <!-- Node: Caddy (focal, sole HTTP entry) -->
      <rect x="164" y="116" width="192" height="132" rx="6" fill="#FAF8F3"/>
      <rect x="164" y="116" width="192" height="132" rx="6" fill="#58A67A1A" stroke="#2E5A46" stroke-width="1"/>
      <rect x="172" y="124" width="48" height="12" rx="2" fill="transparent" stroke="rgba(46,90,70,0.55)" stroke-width="0.8"/>
      <text x="196" y="133" fill="#2E5A46" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
      <text x="260" y="160" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Caddy</text>
      <text x="260" y="176" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:80 · :443</text>
      <rect x="172" y="196" width="176" height="24" rx="4" fill="#F4F0E8" stroke="#5C544B" stroke-width="0.8"/>
      <text x="180" y="212" fill="#3A3530" font-size="12" font-family="'Geist', sans-serif">dot-certs</text>
      <text x="340" y="212" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">/certs</text>

      <!-- Node: DoT -->
      <rect x="164" y="320" width="192" height="108" rx="6" fill="#FAF8F3"/>
      <rect x="164" y="320" width="192" height="108" rx="6" fill="#F4F0E8" stroke="#3A3530" stroke-width="1"/>
      <rect x="172" y="328" width="32" height="12" rx="2" fill="transparent" stroke="rgba(58,53,48,0.40)" stroke-width="0.8"/>
      <text x="188" y="337" fill="#3A3530" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="260" y="364" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DoT</text>
      <text x="260" y="380" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:853 → :8533</text>

      <!-- Node: core-api -->
      <rect x="436" y="116" width="224" height="160" rx="6" fill="#FAF8F3"/>
      <rect x="436" y="116" width="224" height="160" rx="6" fill="#F4F0E8" stroke="#3A3530" stroke-width="1"/>
      <rect x="444" y="124" width="32" height="12" rx="2" fill="transparent" stroke="rgba(58,53,48,0.40)" stroke-width="0.8"/>
      <text x="460" y="133" fill="#3A3530" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="548" y="156" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">core-api</text>
      <text x="548" y="172" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8080</text>
      <rect x="444" y="192" width="208" height="24" rx="4" fill="#F4F0E8" stroke="#5C544B" stroke-width="0.8"/>
      <text x="452" y="208" fill="#3A3530" font-size="12" font-family="'Geist', sans-serif">model-bundle</text>
      <text x="644" y="208" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">/models</text>
      <rect x="444" y="224" width="208" height="24" rx="4" fill="#F4F0E8" stroke="#5C544B" stroke-width="0.8"/>
      <text x="452" y="240" fill="#3A3530" font-size="12" font-family="'Geist', sans-serif">ops/secrets</text>
      <text x="644" y="240" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">/run/secrets</text>

      <!-- Node: dns-resolver -->
      <rect x="436" y="320" width="224" height="108" rx="6" fill="#FAF8F3"/>
      <rect x="436" y="320" width="224" height="108" rx="6" fill="#F4F0E8" stroke="#3A3530" stroke-width="1"/>
      <rect x="444" y="328" width="32" height="12" rx="2" fill="transparent" stroke="rgba(58,53,48,0.40)" stroke-width="0.8"/>
      <text x="460" y="337" fill="#3A3530" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="548" y="364" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dns-resolver</text>
      <text x="548" y="380" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:8081</text>

      <!-- Node: Redis -->
      <rect x="740" y="116" width="196" height="108" rx="6" fill="#FAF8F3"/>
      <rect x="740" y="116" width="196" height="108" rx="6" fill="rgba(58,53,48,0.05)" stroke="#5C544B" stroke-width="1"/>
      <rect x="748" y="124" width="48" height="12" rx="2" fill="transparent" stroke="rgba(92,84,75,0.55)" stroke-width="0.8"/>
      <text x="772" y="133" fill="#5C544B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
      <text x="838" y="160" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>
      <text x="838" y="176" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no published ports</text>

      <!-- Node: Data -->
      <rect x="740" y="320" width="196" height="132" rx="6" fill="#FAF8F3"/>
      <rect x="740" y="320" width="196" height="132" rx="6" fill="rgba(58,53,48,0.05)" stroke="#5C544B" stroke-width="1"/>
      <rect x="748" y="328" width="44" height="12" rx="2" fill="transparent" stroke="rgba(92,84,75,0.55)" stroke-width="0.8"/>
      <text x="770" y="337" fill="#5C544B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="838" y="364" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Data</text>
      <text x="838" y="380" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite + volumes</text>
      <rect x="748" y="400" width="180" height="24" rx="4" fill="#F4F0E8" stroke="#5C544B" stroke-width="0.8"/>
      <text x="756" y="416" fill="#3A3530" font-size="12" font-family="'Geist', sans-serif">app-data</text>
      <text x="920" y="416" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">volume</text>

      <!-- Legend strip -->
      <line x1="40" y1="544" x2="960" y2="544" stroke="#E3D9CB" stroke-width="0.8"/>
      <text x="40" y="560" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="572" width="14" height="10" rx="2" fill="#58A67A1A" stroke="#2E5A46" stroke-width="1"/>
      <text x="60" y="580" fill="#5C544B" font-size="8.5" font-family="'Geist', sans-serif">Focal · entry</text>

      <rect x="200" y="572" width="14" height="10" rx="2" fill="#F4F0E8" stroke="#3A3530" stroke-width="1"/>
      <text x="220" y="580" fill="#5C544B" font-size="8.5" font-family="'Geist', sans-serif">Service node</text>

      <rect x="360" y="572" width="14" height="10" rx="2" fill="rgba(58,53,48,0.05)" stroke="#5C544B" stroke-width="1"/>
      <text x="380" y="580" fill="#5C544B" font-size="8.5" font-family="'Geist', sans-serif">Store node</text>

      <rect x="520" y="572" width="14" height="10" rx="2" fill="#F4F0E8" stroke="#5C544B" stroke-width="0.8"/>
      <text x="540" y="580" fill="#5C544B" font-size="8.5" font-family="'Geist', sans-serif">Artifact mount</text>

      <line x1="700" y1="577" x2="728" y2="577" stroke="#2F4A8F" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="736" y="580" fill="#5C544B" font-size="8.5" font-family="'Geist', sans-serif">Cross-zone :port</text>
    </svg>
  </div>
</body>
</html>
