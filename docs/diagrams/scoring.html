<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score to verdict to action</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FAF8F3;
      --color-paper-2: #F4F0E8;
      --color-ink:     #3A3530;
      --color-muted:   #5C544B;
      --color-accent:  #2E5A46;
      --color-accent-tint: #58A67A1A;
      --color-link:    #2F4A8F;
      --color-hairline: #E3D9CB;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">FLOWCHART - SCORING</p>
    <h1>Score to verdict to action</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scoring-title scoring-desc">
      <title id="scoring-title">Score to verdict to action</title>
      <desc id="scoring-desc">Flowchart showing how summed signals pass the 70 and 40 thresholds to block, observe, or allow, with enrichment caps and fail-open degradation.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C544B"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E5A46"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2F4A8F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FAF8F3"/>

      <!-- Arrows (drawn first, behind nodes; straight orthogonal, shared x/y) -->
      <line x1="480" y1="120" x2="480" y2="148" stroke="#5C544B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="208" x2="660" y2="208" stroke="#2E5A46" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="480" y1="268" x2="480" y2="296" stroke="#5C544B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="356" x2="660" y2="356" stroke="#5C544B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="416" x2="480" y2="444" stroke="#5C544B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="356" x2="380" y2="356" stroke="#5C544B" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="300" y1="468" x2="400" y2="468" stroke="#5C544B" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Arrow labels (opaque paper mask + 6-10px gap, open canvas) -->
      <rect x="604" y="188" width="32" height="12" rx="2" fill="#FAF8F3"/>
      <text x="620" y="197" fill="#2E5A46" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="488" y="276" width="24" height="12" rx="2" fill="#FAF8F3"/>
      <text x="500" y="285" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="604" y="336" width="32" height="12" rx="2" fill="#FAF8F3"/>
      <text x="620" y="345" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <rect x="488" y="424" width="24" height="12" rx="2" fill="#FAF8F3"/>
      <text x="500" y="433" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <rect x="320" y="336" width="40" height="12" rx="2" fill="#FAF8F3"/>
      <text x="340" y="345" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GUARD</text>

      <rect x="324" y="448" width="52" height="12" rx="2" fill="#FAF8F3"/>
      <text x="350" y="457" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAIL-OPEN</text>

      <!-- Start oval -->
      <rect x="400" y="72" width="160" height="48" rx="24" fill="rgba(58,53,48,0.03)" stroke="rgba(58,53,48,0.30)" stroke-width="1"/>
      <text x="480" y="94" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Signals summed</text>
      <text x="480" y="110" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">score 0-100</text>

      <!-- Diamond 1 -->
      <polygon points="480,148 580,208 480,268 380,208" fill="#FFFFFF" stroke="#3A3530" stroke-width="1"/>
      <text x="480" y="206" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score &#8805; 70?</text>
      <text x="480" y="222" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">threshold &#183; 70</text>

      <!-- MALICIOUS focal end -->
      <rect x="660" y="184" width="180" height="48" rx="24" fill="#58A67A1A" stroke="#2E5A46" stroke-width="1"/>
      <text x="750" y="206" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MALICIOUS</text>
      <text x="750" y="222" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">block</text>

      <!-- Diamond 2 -->
      <polygon points="480,296 580,356 480,416 380,356" fill="#FFFFFF" stroke="#3A3530" stroke-width="1"/>
      <text x="480" y="354" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score &#8805; 40?</text>
      <text x="480" y="370" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">threshold &#183; 40</text>

      <!-- SUSPICIOUS end -->
      <rect x="660" y="332" width="180" height="48" rx="24" fill="rgba(58,53,48,0.03)" stroke="rgba(58,53,48,0.30)" stroke-width="1"/>
      <text x="750" y="354" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SUSPICIOUS</text>
      <text x="750" y="370" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allow + observe</text>

      <!-- SAFE end -->
      <rect x="400" y="444" width="160" height="48" rx="24" fill="rgba(58,53,48,0.03)" stroke="rgba(58,53,48,0.30)" stroke-width="1"/>
      <text x="480" y="466" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SAFE</text>
      <text x="480" y="482" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allow</text>

      <!-- Enrichment guard note -->
      <rect x="60" y="324" width="240" height="64" rx="6" fill="rgba(58,53,48,0.02)" stroke="rgba(58,53,48,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="180" y="346" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Enrichment guard</text>
      <text x="180" y="362" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TLS / WHOIS capped &#183; advisory</text>
      <text x="180" y="376" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">base &lt; 40 &#183; DNS errors +0</text>

      <!-- Fail-open note -->
      <rect x="60" y="436" width="240" height="64" rx="6" fill="rgba(58,53,48,0.02)" stroke="rgba(58,53,48,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="180" y="458" fill="#3A3530" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fail-open</text>
      <text x="180" y="474" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">provider failure degrades</text>
      <text x="180" y="488" fill="#5C544B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never blocks</text>

      <!-- Legend -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="#E3D9CB" stroke-width="0.8"/>
      <text x="40" y="556" fill="#5C544B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND &#183; SHAPE CARRIES TYPE</text>

      <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(58,53,48,0.03)" stroke="rgba(58,53,48,0.30)" stroke-width="1"/>
      <text x="72" y="582" fill="#5C544B" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

      <polygon points="232,572 244,578 232,584 220,578" fill="#FFFFFF" stroke="#3A3530" stroke-width="1"/>
      <text x="252" y="582" fill="#5C544B" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

      <rect x="348" y="572" width="24" height="12" rx="2" fill="rgba(58,53,48,0.02)" stroke="rgba(58,53,48,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="380" y="582" fill="#5C544B" font-size="8.5" font-family="'Geist', sans-serif">Guard / fail-open</text>

      <line x1="500" y1="578" x2="528" y2="578" stroke="#5C544B" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="536" y="582" fill="#5C544B" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>

      <line x1="620" y1="578" x2="648" y2="578" stroke="#2E5A46" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="656" y="582" fill="#5C544B" font-size="8.5" font-family="'Geist', sans-serif">Block path</text>
    </svg>
  </div>
</body>
</html>
