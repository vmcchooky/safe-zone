[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-zone-ml"
version = "0.1.0"
description = "Safe Zone Custom Domain ML & Feature Extraction Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "idna==3.20",
    "scikit-learn==1.7.2",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.16.3",
    "pyarrow==25.0.1",
    "lightgbm==4.7.0",
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["src"]
