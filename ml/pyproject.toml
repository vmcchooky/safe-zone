[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-zone-ml"
version = "0.1.0"
description = "Safe Zone Custom Domain ML & Feature Extraction Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "idna==3.18",
    "scikit-learn==1.6.1",
    "numpy==2.2.2",
    "pandas==2.2.3",
    "scipy==1.15.1",
    "pyarrow==19.0.0",
    "lightgbm==4.5.0",
    "pytest==8.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["src"]

