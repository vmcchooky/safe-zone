site_name: Safe Zone Documentation
site_description: Zero-cost-first anti-phishing system documentation.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: docs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details

# In-tree Markdown links are enforced by scripts/ops/check_docs_links.py
# in CI (both files and anchors). Docs legitimately reference source and
# evidence files outside docs/ (ui/, ml/, ops/, .github/) that resolve on
# GitHub but not inside the built site, so the site build reports those as
# info instead of failing --strict on them.
validation:
  links:
    not_found: info
    unrecognized_links: info
