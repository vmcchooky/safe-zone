# Opt-in overlay for direct DNS-over-TLS on host port 853.
#
# Use it only with a trusted fullchain/privkey pair exported by
# scripts/ops/export-dot-cert.sh. The production base compose deliberately
# does not publish 853, so disabling DoT cannot leave an empty public port.
services:
  dns-resolver:
    environment:
      SAFE_ZONE_DNS_DOT_ENABLED: "true"
      SAFE_ZONE_DNS_DOT_CERT_FILE: /run/safe-zone/dot-certs/fullchain.pem
      SAFE_ZONE_DNS_DOT_KEY_FILE: /run/safe-zone/dot-certs/privkey.pem
    ports:
      - "${SAFE_ZONE_DNS_DOT_PUBLISHED_PORT:-853}:${SAFE_ZONE_DNS_DOT_CONTAINER_PORT:-8533}"
    volumes:
      - "${SAFE_ZONE_DNS_DOT_CERTS_DIR:-./ops/certs/dot}:/run/safe-zone/dot-certs:ro"
