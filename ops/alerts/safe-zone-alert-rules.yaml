version: 1
metrics_format: json
# 2026-09-20: core_api_status moved from "/" to authenticated /v1/status.
# 2026-09-29: /metrics on core-api is now authenticated too. It exposes the
# per-endpoint request summary (method, path, status, counts, latency), which
# an anonymous caller can use to fingerprint the API surface and read
# 401/403/429 rates as a brute-force progress signal.
#
# EVERY core-api source below must authenticate with the admin API key as a
# bearer token. This reverses the earlier decision to leave /metrics public,
# which was made to avoid breaking unauthenticated Grafana scrapes; the
# scraper configuration is updated in the same change.
#
# 2026-09-27: dns-resolver /metrics is now gated the same way. It was left open
# on the argument that it has no login endpoint and therefore no 401/403/429 to
# leak, but the request summary still discloses which endpoints exist, how they
# are used, and when the resolver is under load, which is reconnaissance for an
# attack that never needs a password. dns-resolver status ("/") stays public:
# it is the liveness source for the dns-resolver-down rule and backs no
# privileged capability.
#
# Example (Prometheus/blackbox style):
#   Authorization: Bearer $SAFE_ZONE_ADMIN_API_KEY
#
# An unset SAFE_ZONE_ADMIN_API_KEY makes dns-resolver /metrics fail closed with
# 401. That is deliberate: it is better a scraper reports a credential problem
# than an operator believes the endpoint is protected while it is public.
source_endpoints:
  core_api_status: http://127.0.0.1:8080/v1/status
  core_api_metrics: http://127.0.0.1:8080/metrics
  dns_resolver_status: http://127.0.0.1:8081/
  dns_resolver_metrics: http://127.0.0.1:8081/metrics
# Auth header required for every source above except dns_resolver_status.
# Supply the value from SAFE_ZONE_ADMIN_API_KEY; never commit the token itself.
auth:
  core_api_status:
    header: Authorization
    scheme: Bearer
    value_from: SAFE_ZONE_ADMIN_API_KEY
  core_api_metrics:
    header: Authorization
    scheme: Bearer
    value_from: SAFE_ZONE_ADMIN_API_KEY
  dns_resolver_metrics:
    header: Authorization
    scheme: Bearer
    value_from: SAFE_ZONE_ADMIN_API_KEY

rules:
  - id: core-api-down
    severity: critical
    condition: core_api_status.http_status != 200 for 2m
    action: page operator immediately

  - id: dns-resolver-down
    severity: critical
    condition: dns_resolver_status.http_status != 200 for 2m
    action: page operator immediately

  - id: redis-unavailable
    severity: warning
    condition: core_api_status.json.redis.configured == true and core_api_status.json.redis.status != "ok" for 5m
    action: investigate Redis health; Safe Zone is fail-open but cache/feed coverage is degraded

  - id: redis-unsafe-eviction-policy
    severity: critical
    condition: core_api_status.json.redis.configured == true and core_api_status.json.redis.eviction_policy_safe == false for 5m
    action: set SAFE_ZONE_REDIS_MAXMEMORY_POLICY=volatile-lru (or noeviction), restart Redis safely, and verify the threat feed remains populated

  - id: redis-memory-pressure
    severity: warning
    condition: core_api_status.json.redis.maxmemory_bytes > 0 and core_api_status.json.redis.used_memory_bytes / core_api_status.json.redis.maxmemory_bytes > 0.90 for 10m
    action: inspect cache churn and feed growth; raise the bounded Redis memory budget or reduce expiring cache pressure before feed sync returns OOM

  - id: threat-feed-stale
    severity: critical
    condition: core_api_status.json.feed_sync.configured == true and core_api_status.json.feed_sync.stale == true and core_api_status.json.feed_sync.status != "missing" for 15m
    action: run feed sync, inspect source reachability, and confirm last_success_at moved forward

  - id: threat-feed-missing
    severity: critical
    condition: core_api_status.json.feed_sync.configured == true and core_api_status.json.feed_sync.status == "missing" for 2m
    action: inspect Redis memory/eviction policy, restore or rerun feed sync, and verify active_entries is greater than zero

  - id: threat-feed-parser-drift
    severity: warning
    condition: any core_api_status.json.feed_sync.sources[*].parser_drift == true for 15m
    action: inspect parser_drift_reason and confirm the upstream feed format did not change

  # A source that syncs successfully with zero valid domains. Unlike a stale or
  # failing source, this one leaves no error anywhere: parser_drift cannot see it
  # either, because an empty or comment-only body has no invalid lines, so the
  # ratio denominator is zero. The sync exits 0 and records success while that
  # source's members age out over their TTL, so coverage shrinks quietly.
  #
  # Severity and window match threat-feed-parser-drift deliberately. It is a
  # warning rather than critical because the other three sources still refresh, and
  # 15m rather than immediate so a single unlucky upstream response is not paged.
  # If a source is legitimately empty most of the time, suppress it here rather
  # than raising the threshold globally.
  - id: threat-feed-empty-ingest
    severity: warning
    condition: any core_api_status.json.feed_sync.sources[*].empty_ingest == true for 15m
    action: inspect sources[*].empty_ingest_reason and confirm the upstream feed is still serving domains; blocking coverage for that source decays until its members expire

  - id: high-http-5xx-rate
    severity: warning
    condition: sum core_api_metrics.json.metrics.request_summary[* where status>=500].count increases by > 10 over 5m
    action: inspect request logs with matching request IDs

  - id: doh-upstream-failure
    severity: critical
    condition: dns_resolver_metrics.json.upstream_doh.failures_total increases by > 0 over 5m
    action: verify SAFE_ZONE_UPSTREAM_DOH_URL reachability and upstream provider status

  - id: high-doh-latency
    severity: warning
    condition: average dns_resolver_metrics.json.metrics.request_summary["POST /dns-query 200"].total_duration_ms / count > 150 over 10m
    action: inspect upstream latency, Redis, and TLS/WHOIS enrichment settings

  - id: url-ml-shadow-degraded
    severity: critical
    condition: core_api_status.json.ml.url.mode == "shadow" and core_api_status.json.ml.url.state != "ready" for 2m
    action: return SAFE_ZONE_URL_ML_MODE to disabled, restart core-api, and verify the bundle mount/checksum

  - id: url-ml-prediction-errors
    severity: warning
    condition: core_api_status.json.ml.url.error_histogram.prediction_error increases by > 0 over 5m
    action: inspect bundle/runtime errors; URL ML remains fail-open and must not be promoted to canary

  - id: url-ml-invalid-context-rate
    severity: warning
    condition: core_api_status.json.ml.url.prediction_attempts >= 100 and error_histogram.invalid_url_context / prediction_attempts > 0.05 for 15m
    action: inspect caller contract compliance without logging raw URL or query values

  - id: url-ml-high-latency
    severity: warning
    condition: core_api_status.json.ml.url.latency_p95_us > 2000 for 10m
    action: reduce SAFE_ZONE_URL_ML_SHADOW_PERCENT or disable URL ML and inspect CPU/allocation pressure

  - id: url-ml-operational-drift
    severity: warning
    condition: core_api_status.json.ml.url.drift.operational_reference == true and core_api_status.json.ml.url.drift.state == "alert" for 30m
    action: hold canary progression and compare the live aggregate histogram with the frozen operational baseline

  - id: url-ml-context-coverage-drop
    severity: info
    condition: core_api_status.json.ml.url.coverage.analyze_requests >= 100 and core_api_status.json.ml.url.coverage.context_coverage_rate < 0.01 for 60m
    action: verify the UI/SDK URL-context integration is deployed and callers send requested_url; coverage gates canary conclusions

  - id: url-ml-operational-baseline-unavailable
    severity: warning
    condition: core_api_status.json.ml.url.operational_baseline.loaded == false and core_api_status.json.ml.url.enabled == true for 30m
    action: check SAFE_ZONE_URL_ML_BASELINE_PATH mount and artifact checksum; runtime stays fail-open but drift monitoring is non-operational until restored

  # Decision-pipeline fail-open counters. Each process keeps its own counters,
  # so core-api and dns-resolver are alerted separately: a shared SQLite fault
  # affects both, but a process-local fault must not be inferred from the other.
  #
  # override_consecutive_failures is the field to alert on, not the lifetime
  # total: it resets on the first success, so a non-zero value for a sustained
  # period means an operator block is not being applied right now.
  - id: core-api-override-lookup-failing
    severity: critical
    condition: core_api_status.json.decision_pipeline.override_consecutive_failures > 0 for 10m
    action: inspect SQLite health and the core-api logs; operator blocks are failing open and the domain is evaluated normally

  - id: dns-resolver-override-lookup-failing
    severity: critical
    condition: dns_resolver_status.json.decision_pipeline.override_consecutive_failures > 0 for 10m
    action: inspect SQLite health and the dns-resolver logs; operator blocks are failing open and the domain is evaluated normally

  - id: core-api-group-lookup-failing
    severity: warning
    condition: core_api_status.json.decision_pipeline.group_consecutive_failures > 0 for 10m
    action: inspect SQLite health; clients are evaluated under the built-in default group until group lookup recovers

  - id: dns-resolver-group-lookup-failing
    severity: warning
    condition: dns_resolver_status.json.decision_pipeline.group_consecutive_failures > 0 for 10m
    action: inspect SQLite health; clients are evaluated under the built-in default group until group lookup recovers

  - id: core-api-feed-lookup-failing
    severity: warning
    condition: core_api_status.json.decision_pipeline.feed_consecutive_failures > 0 for 15m
    action: inspect Redis feed key and connectivity; the IOC layer is blind for affected evaluations

  - id: dns-resolver-feed-lookup-failing
    severity: warning
    condition: dns_resolver_status.json.decision_pipeline.feed_consecutive_failures > 0 for 15m
    action: inspect Redis feed key and connectivity; the IOC layer is blind for affected DNS evaluations

  # A configured exception set that failed its last reload is not in effect.
  # The last_reload_ok field is false until the first successful reload, so the
  # 15m window avoids paging during a normal start-up.
  - id: core-api-adblock-exceptions-reload-failing
    severity: warning
    condition: core_api_status.json.adblock.exceptions.configured == true and core_api_status.json.adblock.exceptions.last_reload_ok == false for 15m
    action: inspect the exception file/store and last_error_class; content exceptions are not being applied

  - id: dns-resolver-adblock-exceptions-reload-failing
    severity: warning
    condition: dns_resolver_status.json.adblock.exceptions.configured == true and dns_resolver_status.json.adblock.exceptions.last_reload_ok == false for 15m
    action: inspect the exception file/store and last_error_class; content exceptions are not being applied on the DNS path

  # loaded=false is only set after a failed load attempt. The previous index is
  # retained, so the service works, but the allow list is not the operator's
  # current configuration and allowlisted domains can be scored and blocked.
  - id: core-api-whitelist-not-loaded
    severity: warning
    condition: core_api_status.json.whitelist.loaded == false for 10m
    action: inspect the whitelist load error in the logs and confirm the durable revision; the previous allow list remains in effect

  - id: dns-resolver-whitelist-not-loaded
    severity: warning
    condition: dns_resolver_status.json.whitelist.loaded == false for 10m
    action: inspect the whitelist load error in the logs and confirm the durable revision; the previous allow list remains in effect

  # DNS cache corruption and refresh failures are not request-level noise: a
  # failed validation drops the entry, and a stale answer means the upstream is
  # unavailable and RFC 8767 fallback is masking it.
  - id: dns-cache-invalid-entries
    severity: warning
    condition: dns_resolver_metrics.json.metrics.counters["dns_cache_invalid_total"] increases by > 0 over 15m
    action: inspect cached response validation logs; a corrupt or mismatched entry is being dropped instead of served

  - id: dns-cache-refresh-failing
    severity: warning
    condition: dns_resolver_metrics.json.metrics.counters["dns_cache_refresh_failures_total"] increases by > 0 over 15m
    action: inspect upstream DoH health; background refresh failures leave popular entries to expire without replacement

  - id: dns-cache-serving-stale
    severity: warning
    condition: dns_resolver_metrics.json.metrics.counters["dns_cache_stale_served_total"] increases by > 0 over 10m
    action: inspect upstream DoH reachability; clients are receiving stale answers because the upstream lookup failed

  # Readiness counters increment only when /readyz is probed, which both Compose
  # healthchecks do. The mandatory SQLite check failing means the service cannot
  # enforce operator policy, even though the HTTP layer may still answer.
  - id: core-api-readiness-sqlite-failing
    severity: critical
    condition: core_api_metrics.json.metrics.counters["readiness_check_sqlite_failures_total"] increases by > 0 over 10m
    action: inspect SQLite health and disk space; core-api is reporting not_ready and operator policy is not being enforced

  - id: dns-resolver-readiness-sqlite-failing
    severity: critical
    condition: dns_resolver_metrics.json.metrics.counters["readiness_check_sqlite_failures_total"] increases by > 0 over 10m
    action: inspect SQLite health and disk space; dns-resolver is reporting not_ready and operator policy is not being enforced

  - id: core-api-readiness-whitelist-failing
    severity: warning
    condition: core_api_metrics.json.metrics.counters["readiness_check_whitelist_failures_total"] increases by > 0 over 15m
    action: inspect the whitelist load path; core-api readiness is degraded and allowlisted domains may be scored

  - id: dns-resolver-readiness-whitelist-failing
    severity: warning
    condition: dns_resolver_metrics.json.metrics.counters["readiness_check_whitelist_failures_total"] increases by > 0 over 15m
    action: inspect the whitelist load path; dns-resolver readiness is degraded and allowlisted domains may be scored
