version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # misspell, unconvert and prealloc were trialled against the whole tree and
    # came back with zero issues (prealloc needed two test-only preallocations
    # in whitelist_context_test.go, fixed alongside).
    - misspell
    - unconvert
    - prealloc
    # revive runs with ONLY the bug-finding rules below (a `rules:` list means
    # nothing else runs). The style rules were measured at 297 exported, 91
    # unused-parameter and 34 package-comments findings and deliberately left
    # out. Those are a docs-and-rename campaign, not a gate; enabling them
    # would drown the signal these six provide.
    #
    # Also evaluated and left off: gocritic flags four genuine exitAfterDefer
    # shutdown paths (behavior changes, not lint fixes) plus two intentional
    # whitespace test fixtures; nilnil flags three deliberate (nil, nil) API
    # contracts where the linter's advice contradicts the established
    # convention (see service_test-adjacent history and store New()/lookup
    # paths). Each wants its own redesign PR, not a drive-by enable here.
    - revive
  settings:
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: indent-error-flow
        - name: redefines-builtin-id
        - name: time-naming
        - name: var-naming
  exclusions:
    paths:
      - ^tmp/
